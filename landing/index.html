<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#080c09" />
    <meta
      name="description"
      content="Wcash network explorers and public network tools."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Wcash Explorer" />
    <meta
      property="og:description"
      content="Public tools for the Wcash network."
    />
    <meta property="og:url" content="https://wcashexplorer.com/" />
    <meta property="og:image" content="https://wcashexplorer.com/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wcash Explorer" />
    <meta
      name="twitter:description"
      content="Public tools for the Wcash network."
    />
    <meta name="twitter:image" content="https://wcashexplorer.com/og.png" />
    <title>Wcash Explorer</title>
    <link rel="canonical" href="https://wcashexplorer.com/" />
    <link rel="icon" href="/wcash-mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="landing">
      <section class="hero" aria-labelledby="page-title">
        <div class="coin-scene" aria-hidden="true">
          <div class="coin">
            <img
              class="coin-face coin-front"
              src="/wcash-mark.svg"
              alt=""
              width="128"
              height="128"
            />
            <img
              class="coin-face coin-back"
              src="/wcash-mark.svg"
              alt=""
              width="128"
              height="128"
            />
          </div>
        </div>

        <h1 id="page-title">Wcash Explorer</h1>
        <p>Public tools for the Wcash network.</p>
      </section>

      <section class="networks" aria-label="Available network explorers">
        <a
          class="network-card"
          href="https://testnet.wcashexplorer.com/"
          aria-label="Open the Wcash Testnet explorer"
        >
          <span class="network-status" aria-hidden="true"></span>
          <span class="network-copy">
            <strong>Testnet Explorer</strong>
            <span>testnet.wcashexplorer.com</span>
          </span>
          <span class="network-arrow" aria-hidden="true">&#8599;</span>
        </a>
        <p class="notice">Testnet coins have no monetary value.</p>
      </section>
    </main>

    <footer>
      <span>&copy; 2026 Wcash</span>
    </footer>
  </body>
</html>
