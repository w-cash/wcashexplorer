[package]
name = "wcashexplorer"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Reorg-safe Wcash block indexer and explorer API"
repository = "https://github.com/w-cash/wcashexplorer"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["http2", "macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
futures = "0.3"
hex = "0.4"
http = "1.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio-rustls", "uuid"] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.6", features = ["catch-panic", "compression-gzip", "cors", "request-id", "sensitive-headers", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
wcash-zcash-aux = { git = "https://github.com/w-cash/wolf", rev = "9ea02e480d1583dfb26ef2ad46ee3ee7e84d1f8a", features = ["zebra"] }
zebra-chain = { git = "https://github.com/w-cash/wolf", rev = "9ea02e480d1583dfb26ef2ad46ee3ee7e84d1f8a", features = ["wcash-consensus"] }

[patch.crates-io]
# Keep Wcash legacy domains and the isolated NU7 parent dependencies on the same
# reviewed Wolf revision. Dependency-workspace patch tables are not inherited.
zcash_primitives = { git = "https://github.com/w-cash/wolf", rev = "9ea02e480d1583dfb26ef2ad46ee3ee7e84d1f8a", version = "=0.30.1" }
zcash_protocol = { git = "https://github.com/w-cash/wolf", rev = "9ea02e480d1583dfb26ef2ad46ee3ee7e84d1f8a", version = "=0.10.5" }
aead_nu7 = { package = "aead", git = "https://github.com/w-cash/wolf", rev = "9ea02e480d1583dfb26ef2ad46ee3ee7e84d1f8a", version = "=0.6.1" }
cipher_nu7 = { package = "cipher", git = "https://github.com/w-cash/wolf", rev = "9ea02e480d1583dfb26ef2ad46ee3ee7e84d1f8a", version = "=0.5.2" }
curve25519_dalek_nu7 = { package = "curve25519-dalek", git = "https://github.com/w-cash/wolf", rev = "9ea02e480d1583dfb26ef2ad46ee3ee7e84d1f8a", version = "=5.0.0" }
ed25519_zebra_nu7 = { package = "ed25519-zebra", git = "https://github.com/w-cash/wolf", rev = "9ea02e480d1583dfb26ef2ad46ee3ee7e84d1f8a", version = "=5.0.0" }
universal_hash_nu7 = { package = "universal-hash", git = "https://github.com/w-cash/wolf", rev = "9ea02e480d1583dfb26ef2ad46ee3ee7e84d1f8a", version = "=0.6.1" }
zcash_script_nu7 = { package = "zcash_script", git = "https://github.com/w-cash/wolf", rev = "9ea02e480d1583dfb26ef2ad46ee3ee7e84d1f8a", version = "=0.6.0" }
zcash_transparent_nu7 = { package = "zcash_transparent", git = "https://github.com/w-cash/wolf", rev = "9ea02e480d1583dfb26ef2ad46ee3ee7e84d1f8a", version = "=0.11.0" }
zcash_address_nu7 = { package = "zcash_address", git = "https://github.com/w-cash/wolf", rev = "9ea02e480d1583dfb26ef2ad46ee3ee7e84d1f8a", version = "=0.14.0" }

[dev-dependencies]
pretty_assertions = "1.4"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
