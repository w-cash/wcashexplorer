[package]
name = "wcashexplorer"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Reorg-safe Wcash block indexer and explorer API"
repository = "https://github.com/w-cash/wcashexplorer"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["http2", "macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
futures = "0.3"
hex = "0.4"
http = "1.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio-rustls", "uuid"] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.6", features = ["catch-panic", "compression-gzip", "cors", "request-id", "sensitive-headers", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
wcash-zcash-aux = { git = "https://github.com/w-cash/wolf", rev = "72038ceef70b297a1ef771177a3f45a88f53474c", features = ["zebra"] }

[patch.crates-io]
zcash_primitives = { git = "https://github.com/w-cash/wolf", rev = "72038ceef70b297a1ef771177a3f45a88f53474c" }
zcash_protocol = { git = "https://github.com/w-cash/wolf", rev = "72038ceef70b297a1ef771177a3f45a88f53474c" }

[dev-dependencies]
pretty_assertions = "1.4"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
