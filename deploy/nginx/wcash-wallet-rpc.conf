# Public compact-wallet gRPC ingress. The node JSON-RPC remains loopback-only.
limit_req_zone $binary_remote_addr zone=wcash_wallet_rpc:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=wcash_wallet_rpc_conn:10m;

upstream wcash_wallet_rpc_upstream {
    server 127.0.0.1:38234;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name wallet-testnet.wcashexplorer.com;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://wallet-testnet.wcashexplorer.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wallet-testnet.wcashexplorer.com;

    ssl_certificate /etc/letsencrypt/live/wallet-testnet.wcashexplorer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wallet-testnet.wcashexplorer.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 4m;
    client_body_timeout 15s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 60s;

    access_log /var/log/nginx/wcash-wallet-rpc.access.log;
    error_log /var/log/nginx/wcash-wallet-rpc.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    limit_conn wcash_wallet_rpc_conn 12;

    location /cash.z.wallet.sdk.rpc.CompactTxStreamer/ {
        limit_req zone=wcash_wallet_rpc burst=80 nodelay;

        grpc_pass grpc://wcash_wallet_rpc_upstream;
        grpc_set_header Host $host;
        grpc_set_header X-Request-Id $request_id;
        grpc_connect_timeout 3s;
        grpc_read_timeout 60s;
        grpc_send_timeout 60s;
    }

    location / {
        return 404;
    }
}
