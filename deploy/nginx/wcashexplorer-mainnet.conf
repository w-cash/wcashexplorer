# Install this vhost in place of, not alongside, the old apex landing vhost.
# Keep testnet.wcashexplorer.com and its upstreams/certificate unchanged.
limit_req_zone $binary_remote_addr zone=wcashexplorer_mainnet_web:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=wcashexplorer_mainnet_api:10m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=wcashexplorer_mainnet_conn:10m;

upstream wcashexplorer_mainnet_web {
    server 127.0.0.1:3002;
    keepalive 16;
}

upstream wcashexplorer_mainnet_api {
    server 127.0.0.1:8081;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name wcashexplorer.com www.wcashexplorer.com;

    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://wcashexplorer.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.wcashexplorer.com;
    ssl_certificate /etc/letsencrypt/live/wcashexplorer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wcashexplorer.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://wcashexplorer.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wcashexplorer.com;

    ssl_certificate /etc/letsencrypt/live/wcashexplorer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wcashexplorer.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 15s;
    access_log /var/log/nginx/wcashexplorer-mainnet.access.log;
    error_log /var/log/nginx/wcashexplorer-mainnet.error.log warn;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    limit_conn wcashexplorer_mainnet_conn 20;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        limit_req zone=wcashexplorer_mainnet_api burst=5 nodelay;
        limit_except GET HEAD { deny all; }
        rewrite ^ /health/ready break;
        proxy_pass http://wcashexplorer_mainnet_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location /api/ {
        limit_req zone=wcashexplorer_mainnet_api burst=30 nodelay;
        limit_except GET HEAD { deny all; }
        proxy_pass http://wcashexplorer_mainnet_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_send_timeout 5s;
    }

    location / {
        limit_req zone=wcashexplorer_mainnet_web burst=60 nodelay;
        limit_except GET HEAD { deny all; }
        proxy_pass http://wcashexplorer_mainnet_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_send_timeout 5s;
    }

    location ~ /\. { deny all; }
}
