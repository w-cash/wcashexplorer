# Serve the apex landing independently from the Testnet explorer vhost.
limit_req_zone $binary_remote_addr zone=wcashexplorer_landing:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=wcashexplorer_landing_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name wcashexplorer.com www.wcashexplorer.com;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://wcashexplorer.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.wcashexplorer.com;

    ssl_certificate /etc/letsencrypt/live/wcashexplorer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wcashexplorer.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://wcashexplorer.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wcashexplorer.com;

    root /var/www/wcashexplorer-landing;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/wcashexplorer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wcashexplorer.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 15s;

    access_log /var/log/nginx/wcashexplorer-landing.access.log;
    error_log /var/log/nginx/wcashexplorer-landing.error.log warn;

    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; connect-src 'none'; font-src 'self'; form-action 'none'; frame-ancestors 'none'; img-src 'self'; object-src 'none'; script-src 'none'; style-src 'self'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    limit_conn wcashexplorer_landing_conn 10;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        limit_req zone=wcashexplorer_landing burst=20 nodelay;
        limit_except GET HEAD { deny all; }

        expires -1;
        try_files /index.html =404;
    }

    location = /styles.css {
        limit_req zone=wcashexplorer_landing burst=20 nodelay;
        limit_except GET HEAD { deny all; }

        expires 1h;
        try_files /styles.css =404;
    }

    location = /wcash-mark.svg {
        limit_req zone=wcashexplorer_landing burst=20 nodelay;
        limit_except GET HEAD { deny all; }

        expires 1d;
        try_files /wcash-mark.svg =404;
    }

    location = /og.png {
        limit_req zone=wcashexplorer_landing burst=20 nodelay;
        limit_except GET HEAD { deny all; }

        expires 1d;
        try_files /og.png =404;
    }

    location / {
        return 404;
    }
}
