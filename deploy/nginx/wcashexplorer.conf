# These zones belong in Nginx's http context. Debian and Ubuntu include this
# complete file from that context via sites-enabled/.
limit_req_zone $binary_remote_addr zone=wcashexplorer_web:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=wcashexplorer_api:10m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=wcashexplorer_conn:10m;

upstream wcashexplorer_web_upstream {
    server 127.0.0.1:3001;
    keepalive 16;
}

upstream wcashexplorer_api_upstream {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name wcashexplorer.com www.wcashexplorer.com;

    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 15s;

    access_log /var/log/nginx/wcashexplorer.access.log;
    error_log /var/log/nginx/wcashexplorer.error.log warn;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    limit_conn wcashexplorer_conn 20;

    location = /healthz {
        access_log off;
        proxy_pass http://wcashexplorer_api_upstream/health/ready;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location /api/ {
        limit_req zone=wcashexplorer_api burst=30 nodelay;
        limit_except GET HEAD { deny all; }

        proxy_pass http://wcashexplorer_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_send_timeout 5s;
    }

    location / {
        limit_req zone=wcashexplorer_web burst=60 nodelay;
        limit_except GET HEAD { deny all; }

        proxy_pass http://wcashexplorer_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_send_timeout 5s;
    }

    location ~ /\. {
        deny all;
    }
}
