# Temporary HTTP-only vhost used to obtain the first apex certificate.
# Install it as wcashexplorer-landing.conf, issue the certificate with the
# documented webroot command, then replace it with the production vhost.
server {
    listen 80;
    listen [::]:80;
    server_name wcashexplorer.com www.wcashexplorer.com;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://wcashexplorer.com$request_uri;
    }
}
