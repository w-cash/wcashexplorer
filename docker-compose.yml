services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wcashexplorer
      POSTGRES_USER: wcashexplorer
      POSTGRES_PASSWORD: local-only-change-me
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wcashexplorer -d wcashexplorer"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  explorer:
    build: .
    env_file: ${EXPLORER_ENV_FILE:-.env.docker}
    environment:
      DATABASE_URL: postgres://wcashexplorer:local-only-change-me@postgres:5432/wcashexplorer
      WCASH_EXPLORER_BIND: 0.0.0.0:8080
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
